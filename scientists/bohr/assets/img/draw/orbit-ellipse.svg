<text x="400" y="448" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#8B96AA" text-anchor="middle">哈雷问：“引力按距离平方衰减，轨道会是什么形状？” 玻尔答：“椭圆。”</text>
