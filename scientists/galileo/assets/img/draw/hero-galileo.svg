<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="18" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="60" cy="50" r="2"/><circle cx="120" cy="30" r="1.6"/><circle cx="200" cy="60" r="2.2"/>
    <circle cx="300" cy="36" r="1.6"/><circle cx="360" cy="70" r="2"/><circle cx="420" cy="40" r="1.8"/>
    <circle cx="90" cy="110" r="1.4"/><circle cx="250" cy="100" r="1.6"/><circle cx="400" cy="120" r="2"/>
  </g>
  <!-- Jupiter + moons -->
  <g transform="translate(360,200)">
    <circle r="34" fill="#C98A3C"/>
    <ellipse rx="34" ry="10" fill="none" stroke="rgba(120,70,20,.6)" stroke-width="3"/>
    <g fill="#E8D3A6">
      <circle cx="-58" cy="0" r="4"/><circle cx="-30" cy="6" r="3.4"/>
      <circle cx="26" cy="-4" r="4.4"/><circle cx="60" cy="4" r="3.8"/>
    </g>
  </g>
  <!-- telescope -->
  <g transform="rotate(-32 150 230)">
    <rect x="70" y="218" width="150" height="20" rx="10" fill="#5C6B82"/>
    <rect x="60" y="214" width="22" height="28" rx="6" fill="#3B5BDB"/>
    <circle cx="216" cy="228" r="11" fill="#1B2A4A" stroke="#3B5BDB" stroke-width="3"/>
  </g>
  <path d="M150 156 Q210 120 300 150" fill="none" stroke="rgba(245,159,0,.5)" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
