<text x="392" y="412" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#F59F00" text-anchor="start">加速慢</text>

<rect x="230" y="60" width="340" height="80" rx="18" fill="#3B5BDB" opacity=".08"/>
<text x="400" y="112" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#3B5BDB" text-anchor="middle">加速度 = 力 ÷ 质量</text>
<text x="400" y="468" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#8B96AA" text-anchor="middle">同样的力推轻车，跑得更快；同样的加速度要推重车，得用更大的力</text>
